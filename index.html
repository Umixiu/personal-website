<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading</p>
      </div>
    </div>

    <!-- Scroll Progress -->
    <div id="scroll-progress" class="scroll-progress"></div>

    <!-- Starfield Canvas -->
    <canvas id="starfield" aria-hidden="true"></canvas>

    <!-- Mouse Trail Canvas -->
    <canvas id="mouse-trail" aria-hidden="true"></canvas>

    <!-- Parallax Background -->
    <div id="parallax-bg" class="parallax-bg"></div>
    <div class="bg-overlay"></div>

    <!-- Navigation -->
    <nav class="navbar glass">
      <div class="nav-inner">
        <a href="#home" class="nav-logo">Portfolio</a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-wrapper">
      <div class="content-column" id="dynamic-content"></div>

      <aside class="avatar-column">
        <div class="avatar-wrapper">
          <img
            src="images/avatar.jpg"
            alt="Profile avatar"
            class="avatar"
            id="avatar"
          />
        </div>
      </aside>
    </main>

    <!-- Footer -->
    <footer class="footer glass">
      <p>Designed by Umi Li</p>
    </footer>

    <!-- Music Toggle (top-left) -->
    <button class="music-toggle glass glow-btn" id="music-toggle" aria-label="Play music">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3" />
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden>
        <rect x="6" y="4" width="4" height="16" />
        <rect x="14" y="4" width="4" height="16" />
      </svg>
    </button>
    <button
      class="background-toggle glass glow-btn"
      id="background-toggle"
      type="button"
      aria-label="Switch background"
      aria-pressed="false"
      title="Switch background"
    >
      <span aria-hidden="true">◐</span>
    </button>
    <audio id="audio-player" src="lightmusic.mp3" preload="auto" loop></audio>

    <!-- Edit Content Button -->
    <button class="edit-toggle glass glow-btn" id="edit-toggle" aria-label="Edit content">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
    </button>

    <!-- Edit Panel -->
    <div class="edit-panel glass" id="edit-panel" hidden>
      <div class="edit-panel-header">
        <h2>Edit Content</h2>
        <button class="edit-close" id="edit-close" aria-label="Close">&times;</button>
      </div>
      <form id="edit-form" class="edit-form"></form>
      <div class="edit-actions">
        <button type="button" class="glow-btn" id="save-content">Save</button>
        <button type="button" class="glow-btn secondary" id="export-content">Export content.js</button>
        <button type="button" class="glow-btn secondary" id="reset-content">Reset to Default</button>
      </div>
      <p class="edit-hint">Changes are saved in your browser automatically after clicking Save.</p>
    </div>
    <div class="edit-overlay" id="edit-overlay" hidden></div>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
